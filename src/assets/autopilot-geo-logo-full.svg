<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#e8eeff"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099cc"/>
      <stop offset="100%" style="stop-color:#5b10d6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a3a"/>
      <stop offset="60%" style="stop-color:#1a2a6a"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="520" height="120" rx="16" fill="url(#bgGrad)"/>
  <rect width="520" height="120" rx="16" fill="none" stroke="#d0d8f0" stroke-width="1"/>
  <line x1="0" y1="60" x2="520" y2="60" stroke="#0099cc" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="260" y1="0" x2="260" y2="120" stroke="#5b10d6" stroke-width="0.3" stroke-opacity="0.06"/>
  <ellipse cx="60" cy="60" rx="42" ry="42" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-opacity="0.2"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-20 60 60)"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(20 60 60)"/>
  <path d="M 25 48 A 42 42 0 0 1 95 48" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="9" fill="url(#orbitGrad)" filter="url(#softglow)" opacity="0.85"/>
  <circle cx="60" cy="60" r="4.5" fill="#ffffff"/>
  <circle cx="95" cy="43" r="3.5" fill="#0099cc" filter="url(#glow)"/>
  <circle cx="25" cy="76" r="2.5" fill="#5b10d6" filter="url(#glow)" opacity="0.7"/>
  <circle cx="102" cy="60" r="2" fill="#0099cc" opacity="0.5"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#0099cc" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#5b10d6" stroke-width="0.6" stroke-opacity="0.12"/>
  <text x="132" y="52" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="3.5" fill="#7080a0" text-anchor="start">AUTOPILOT</text>
  <line x1="132" y1="59" x2="490" y2="59" stroke="url(#orbitGrad)" stroke-width="0.5" stroke-opacity="0.25"/>
  <text x="128" y="98" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#textGrad)" text-anchor="start">GEO</text>
  <circle cx="273" cy="90" r="5" fill="url(#orbitGrad)" filter="url(#glow)"/>
  <text x="292" y="98" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0.5" fill="#8090b0" text-anchor="start">Rank in ChatGPT · Gemini · AI Search</text>
</svg>