<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 90 90" width="90" height="90">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099cc"/>
      <stop offset="100%" style="stop-color:#5b10d6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <ellipse cx="60" cy="60" rx="42" ry="42" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-opacity="0.2"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-20 60 60)"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(20 60 60)"/>
  <path d="M 25 48 A 42 42 0 0 1 95 48" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="9" fill="url(#orbitGrad)" filter="url(#softglow)" opacity="0.85"/>
  <circle cx="60" cy="60" r="4.5" fill="#ffffff"/>
  <circle cx="95" cy="43" r="3.5" fill="#0099cc" filter="url(#glow)"/>
  <circle cx="25" cy="76" r="2.5" fill="#5b10d6" filter="url(#glow)" opacity="0.7"/>
  <circle cx="102" cy="60" r="2" fill="#0099cc" opacity="0.5"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#0099cc" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#5b10d6" stroke-width="0.6" stroke-opacity="0.12"/>
</svg>
