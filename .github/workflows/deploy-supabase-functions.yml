name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  PROJECT_REF: xpwghzwkvjmksenrnaxl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is empty — add it in GitHub Settings > Secrets > Actions"
            exit 1
          fi
          echo "✅ Token found"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase project
        run: supabase link --project-ref $PROJECT_REF --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Pull env vars from Vercel
        run: |
          npx vercel env pull .env.vercel --environment=production --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_9xKu6hphYbJwNnjCQKZyULvZ
          VERCEL_PROJECT_ID: prj_IJPWmET8RtfjTTbwd4SxBP1IKbc9

      - name: Sync secrets to Supabase (Vercel is the source of truth)
        run: |
          set -a
          source .env.vercel
          set +a
          rm -f .env.vercel
          supabase secrets set \
            ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
            TWILIO_PHONE_NUMBER="${{ secrets.TWILIO_PHONE_NUMBER }}" \
            TWILIO_WHATSAPP_NUMBER="whatsapp:${{ secrets.TWILIO_PHONE_NUMBER }}" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            LOVABLE_API_KEY="$LOVABLE_API_KEY" \
            DATAFORSEO_LOGIN="$DATAFORSEO_LOGIN" \
            DATAFORSEO_PASSWORD="$DATAFORSEO_PASSWORD" \
            STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --project-ref $PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ALL edge functions
        run: |
          set -e
          FAILED=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # skip shared code folders (no entrypoint) and hidden dirs
            case "$name" in _*|.*) echo "⏭️  Skipping $name"; continue;; esac
            if [ ! -f "$dir/index.ts" ]; then
              echo "⏭️  Skipping $name (no index.ts)"
              continue
            fi
            echo "🚀 Deploying $name..."
            if ! supabase functions deploy "$name" --project-ref $PROJECT_REF --no-verify-jwt; then
              echo "❌ Failed: $name"
              FAILED="$FAILED $name"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "❌ Some functions failed to deploy:$FAILED"
            exit 1
          fi
          echo "✅ All Edge Functions deployed successfully!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
