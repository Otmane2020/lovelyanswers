name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is empty — add it in GitHub Settings > Secrets > Actions"
            exit 1
          fi
          echo "✅ Token found"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase project
        run: supabase link --project-ref pnohfokjlhpzrkczruju --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
            TWILIO_PHONE_NUMBER="${{ secrets.TWILIO_PHONE_NUMBER }}" \
            TWILIO_WHATSAPP_NUMBER="whatsapp:${{ secrets.TWILIO_PHONE_NUMBER }}" \
            --project-ref pnohfokjlhpzrkczruju
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy every function in supabase/functions
        # Deploying two hardcoded functions here meant every other function in
        # the repo — including ones actively wired into the app — silently
        # never reached production. `functions deploy` with no name deploys
        # everything under supabase/functions, honoring each function's
        # verify_jwt/entrypoint from supabase/config.toml.
        run: |
          supabase functions deploy \
            --project-ref pnohfokjlhpzrkczruju
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success
        run: echo "✅ All Edge Functions deployed successfully!"
