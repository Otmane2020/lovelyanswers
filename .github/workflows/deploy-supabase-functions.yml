name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  PROJECT_REF: xpwghzwkvjmksenrnaxl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is empty — add it in GitHub Settings > Secrets > Actions"
            exit 1
          fi
          echo "✅ Token found"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase project
        run: supabase link --project-ref $PROJECT_REF --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Secrets (OPENROUTER_API_KEY, STRIPE_SECRET_KEY, etc.) are managed
      # directly in the Supabase dashboard now — Project Settings > Edge
      # Functions > Secrets — not synced from Vercel by this workflow. The
      # previous "pull from Vercel, then `supabase secrets set`" step
      # silently overwrote real Supabase secrets with a placeholder
      # whenever the matching Vercel env var was marked "Sensitive" (Vercel
      # then hands CI a redacted stand-in instead of the real value), which
      # broke Stripe billing and every AI provider call. Supabase is now the
      # single source of truth; this workflow only ever deploys code.

      - name: Deploy ALL edge functions
        run: |
          set -e
          FAILED=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # skip shared code folders (no entrypoint) and hidden dirs
            case "$name" in _*|.*) echo "⏭️  Skipping $name"; continue;; esac
            if [ ! -f "$dir/index.ts" ]; then
              echo "⏭️  Skipping $name (no index.ts)"
              continue
            fi
            echo "🚀 Deploying $name..."
            if ! supabase functions deploy "$name" --project-ref $PROJECT_REF --no-verify-jwt; then
              echo "❌ Failed: $name"
              FAILED="$FAILED $name"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "❌ Some functions failed to deploy:$FAILED"
            exit 1
          fi
          echo "✅ All Edge Functions deployed successfully!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
