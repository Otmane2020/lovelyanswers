<svg viewBox="0 0 1200 1420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@600;700&amp;display=swap');
    .eyebrow{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;}
    .word{font-family:'Space Grotesk',sans-serif;font-weight:700;}
    .cap{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
  </style>

  <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#5f6ce0"/>
    <stop offset="100%" stop-color="#1f2761"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fbeec3"/>
    <stop offset="55%" stop-color="#e3c675"/>
    <stop offset="100%" stop-color="#a9791b"/>
  </linearGradient>
  <linearGradient id="goldGradSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f3e3ad"/>
    <stop offset="100%" stop-color="#c79a2e"/>
  </linearGradient>

  <g id="mark">
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGradSoft)" stroke-width="1.6" stroke-dasharray="118 400" stroke-linecap="round" transform="rotate(-52 50 50)" opacity=".85"/>
    <circle cx="90.6" cy="26.4" r="3.1" fill="url(#goldGrad)"/>
    <path d="M50 8 C54.5 32 57.5 39 84 44 C57.5 49 54.5 56 50 80 C45.5 56 42.5 49 16 44 C42.5 39 45.5 32 50 8 Z" fill="url(#goldGrad)"/>
    <path d="M76 14 C77.6 21 79 22.4 86 24 C79 25.6 77.6 27 76 34 C74.4 27 73 25.6 66 24 C73 22.4 74.4 21 76 14 Z" fill="url(#goldGrad)" opacity=".92"/>
  </g>
</defs>

<rect width="1200" height="1420" fill="#f5f6fb"/>

<g transform="translate(150,486) scale(1.2)">
  <use href="#mark"/>
</g>
<text x="310" y="533" class="eyebrow" font-size="20" fill="#8992d6">AUTOPILOT</text>
<text x="308" y="590" class="word" font-size="64" fill="#14162e">GEO</text>
</svg>
